    doc:function(path){var p=path.split("/"),r=col(p[2]).doc(p[3]);return{
      set:function(v){return r.set(v)},delete:function(){return r.delete()},
      get:function(){return r.get().then(function(s){return{exists:s.exists,data:function(){return s.data()}}})}}},
    collection:function(path){var c=col(path.split("/")[2]);return{
      get:function(){return c.get().then(wrap)},
      onSnapshot:function(cb,eb){return c.onSnapshot(function(sn){cb(wrap(sn))},eb)}}}
  };
}

  if(c==="auth/weak-password")return "A senha precisa ter pelo menos 8 caracteres.";
  if(c==="auth/invalid-email")return "Digite um e-mail válido.";
  if(c==="auth/too-many-requests")return "Muitas tentativas. Tente de novo em alguns minutos.";
  if(c==="auth/network-request-failed")return "Sem conexão com a internet.";

async function doSignup(){

  return shareUrl(o.token);
}

  $("c_sv").onclick=async function(){
    var n=$("c_nome").value.trim();if(!n)return toast("Informe o nome da empresa");
    var c={_k:"config",nome:n,sub:$("c_sub").value.trim(),cnpj:$("c_cnpj").value.trim(),tel:$("c_tel").value.trim(),end:$("c_end").value.trim()};
    $("c_sv").disabled=true;
    try{await db.doc(P("config","empresa")).set(c);co=c;applyCo();toast("Dados salvos");if(first)start()}
    catch(e){$("c_sv").disabled=false;toast("Erro ao salvar")}
  };
}
